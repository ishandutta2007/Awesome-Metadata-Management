<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 800; fill: url(#textGrad); letter-spacing: -1px; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 500; fill: #e2e8f0; letter-spacing: 0.5px; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #38bdf8; }
      
      @keyframes pulseNode {
        0%, 100% { r: 6px; opacity: 0.6; }
        50% { r: 10px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(180deg); }
        100% { transform: translateY(0px) rotate(360deg); }
      }
      @keyframes pulseDash {
        to { stroke-dashoffset: -40; }
      }

      .node { animation: pulseNode 3s infinite ease-in-out; }
      .node-delay1 { animation-delay: 1s; }
      .node-delay2 { animation-delay: 2s; }
      .floating { animation: floatParticle 6s infinite ease-in-out; }
      .data-line { stroke: #6366f1; stroke-width: 1.5; stroke-dasharray: 8 6; opacity: 0.4; animation: pulseDash 4s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="2"/>

  <!-- Dynamic / Animated Background Graphics (Low Opacity behind text) -->
  <g opacity="0.25">
    <!-- Graph Network Connections -->
    <path d="M 100,80 L 250,150 L 400,90 L 600,180 L 850,100 L 1100,160" class="data-line" />
    <path d="M 150,280 L 300,200 L 550,290 L 800,220 L 1050,300" class="data-line" style="animation-duration: 6s;" />
    <path d="M 250,150 L 300,200 M 600,180 L 550,290 M 850,100 L 800,220" class="data-line" style="animation-duration: 3s;" />

    <!-- Pulsing Nodes -->
    <circle cx="100" cy="80" r="8" fill="#38bdf8" class="node" />
    <circle cx="250" cy="150" r="8" fill="#818cf8" class="node node-delay1" />
    <circle cx="400" cy="90" r="8" fill="#c084fc" class="node node-delay2" />
    <circle cx="600" cy="180" r="8" fill="#38bdf8" class="node" />
    <circle cx="850" cy="100" r="8" fill="#818cf8" class="node node-delay1" />
    <circle cx="1100" cy="160" r="8" fill="#c084fc" class="node node-delay2" />
    
    <circle cx="150" cy="280" r="8" fill="#818cf8" class="node node-delay2" />
    <circle cx="300" cy="200" r="8" fill="#38bdf8" class="node" />
    <circle cx="550" cy="290" r="8" fill="#c084fc" class="node node-delay1" />
    <circle cx="800" cy="220" r="8" fill="#38bdf8" class="node node-delay2" />
    <circle cx="1050" cy="300" r="8" fill="#818cf8" class="node" />

    <!-- Floating Hexagons / Decor -->
    <polygon points="90,220 105,210 120,220 120,240 105,250 90,240" fill="none" stroke="#38bdf8" stroke-width="1.5" class="floating" />
    <polygon points="1080,70 1095,60 1110,70 1110,90 1095,100 1080,90" fill="none" stroke="#c084fc" stroke-width="1.5" class="floating" style="animation-delay: 2s;" />
  </g>

  <!-- Foreground Content (Always clear & visible) -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Pill Tag -->
    <rect x="-140" y="45" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="66" class="badge-text" text-anchor="middle">📊 CURATED ENTERPRISE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title" filter="url(#glow)">Awesome Metadata Management 🗂️</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">Data Catalog • Governance • Lineage • Observability • Data Products &amp; AI Context</text>

    <!-- Feature Badges Line -->
    <g transform="translate(0, 240)">
      <!-- Badge 1: Catalog & Lineage -->
      <rect x="-330" y="0" width="200" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="-230" y="23" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">🔍 Catalog &amp; Lineage</text>

      <!-- Badge 2: Data Governance -->
      <rect x="-110" y="0" width="220" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="0" y="23" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">🛡️ Governance &amp; Security</text>

      <!-- Badge 3: Active Metadata -->
      <rect x="130" y="0" width="200" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="230" y="23" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">⚡ Active Metadata &amp; AI</text>
    </g>

    <!-- Bottom Tech Tags -->
    <text x="0" y="315" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
      DataHub • OpenMetadata • Apache Atlas • OpenLineage • Marquez • Egeria • Gravitino • OPA • CKAN
    </text>
  </g>
</svg>
