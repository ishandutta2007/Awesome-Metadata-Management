<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseNode{0%{r:6px;opacity:.6}50%{r:10px;opacity:1;filter:drop-shadow(0 0 6px #38bdf8)}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(180deg)}}.title{font-size:52px;font-weight:800;fill:url(#textGrad);letter-spacing:-1px}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-size:22px;font-weight:500;fill:#e2e8f0;letter-spacing:.5px}.badge-text{font-size:14px;font-weight:600;fill:#38bdf8}.node{animation:pulseNode 3s infinite ease-in-out}.node-delay1{animation-delay:1s}.node-delay2{animation-delay:2s}.floating{animation:floatParticle 6s infinite ease-in-out}.data-line{stroke:#6366f1;stroke-width:1.5;stroke-dasharray:8 6;opacity:.4;animation:pulseDash 4s linear infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" stroke="#312e81" stroke-width="2" rx="16"/><g opacity=".25"><path d="M 100,80 L 250,150 L 400,90 L 600,180 L 850,100 L 1100,160" class="data-line"/><path d="M 150,280 L 300,200 L 550,290 L 800,220 L 1050,300" class="data-line" style="animation-duration:6s"/><path d="M 250,150 L 300,200 M 600,180 L 550,290 M 850,100 L 800,220" class="data-line" style="animation-duration:3s"/><circle cx="100" cy="80" r="8" fill="#38bdf8" class="node"/><circle cx="250" cy="150" r="8" fill="#818cf8" class="node node-delay1"/><circle cx="400" cy="90" r="8" fill="#c084fc" class="node node-delay2"/><circle cx="600" cy="180" r="8" fill="#38bdf8" class="node"/><circle cx="850" cy="100" r="8" fill="#818cf8" class="node node-delay1"/><circle cx="1100" cy="160" r="8" fill="#c084fc" class="node node-delay2"/><circle cx="150" cy="280" r="8" fill="#818cf8" class="node node-delay2"/><circle cx="300" cy="200" r="8" fill="#38bdf8" class="node"/><circle cx="550" cy="290" r="8" fill="#c084fc" class="node node-delay1"/><circle cx="800" cy="220" r="8" fill="#38bdf8" class="node node-delay2"/><circle cx="1050" cy="300" r="8" fill="#818cf8" class="node"/><polygon fill="none" stroke="#38bdf8" stroke-width="1.5" points="90 220 105 210 120 220 120 240 105 250 90 240" class="floating"/><polygon fill="none" stroke="#c084fc" stroke-width="1.5" points="1080 70 1095 60 1110 70 1110 90 1095 100 1080 90" class="floating" style="animation-delay:2s"/></g><g text-anchor="middle" transform="translate(600, 0)"><rect width="280" height="32" x="-140" y="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="16"/><text x="0" y="66" class="badge-text" text-anchor="middle">📊 CURATED ENTERPRISE ECOSYSTEM</text><text x="0" y="145" class="title" filter="url(#glow)">Awesome Metadata Management 🗂️</text><text x="0" y="195" class="subtitle">Data Catalog • Governance • Lineage • Observability • Data Products &amp; AI Context</text><g transform="translate(0, 240)"><rect width="200" height="36" x="-330" y="0" fill="#0f172a" stroke="#475569" stroke-width="1" rx="8"/><text x="-230" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🔍 Catalog &amp; Lineage</text><rect width="220" height="36" x="-110" y="0" fill="#0f172a" stroke="#475569" stroke-width="1" rx="8"/><text x="0" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🛡️ Governance &amp; Security</text><rect width="200" height="36" x="130" y="0" fill="#0f172a" stroke="#475569" stroke-width="1" rx="8"/><text x="230" y="23" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">⚡ Active Metadata &amp; AI</text></g><text x="0" y="315" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">DataHub • OpenMetadata • Apache Atlas • OpenLineage • Marquez • Egeria • Gravitino • OPA • CKAN</text></g></svg>